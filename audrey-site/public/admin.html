<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — audrey-lillie</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/img/logo-red.png">
<style>
  :root {
    --a-bg: #f4f3ef;
    --a-card: #ffffff;
    --a-ink: #1a1a1a;
    --a-muted: #77776f;
    --a-line: #e2e0d8;
    --a-accent: #e4232e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--a-bg);
    color: var(--a-ink);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 14px;
  }
  button { font-family: inherit; }
  input, select, textarea {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 9px;
    border: 1px solid var(--a-line);
    border-radius: 7px;
    background: #fff;
    color: var(--a-ink);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid #1c244033; }

  /* ---- Login ---- */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-wrap[hidden] { display: none; }
  .login-card {
    background: var(--a-card);
    border: 1px solid var(--a-line);
    border-radius: 14px;
    padding: 36px;
    width: min(360px, 90vw);
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.07);
  }
  .login-card img { height: 44px; margin-bottom: 18px; }
  .login-card h1 { font-size: 16px; margin: 0 0 18px; }
  .login-card input { width: 100%; margin-bottom: 12px; padding: 10px; }
  .login-error { color: var(--a-accent); font-size: 12px; min-height: 16px; margin: 0 0 8px; }

  /* ---- Layout ---- */
  .admin-top {
    position: sticky;
    top: 0;
    z-index: 50;
    background: color-mix(in srgb, var(--a-bg) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--a-line);
    padding: 12px 22px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .admin-top img { height: 30px; }
  .admin-tabs { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  .admin-tab {
    border: none;
    background: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--a-muted);
  }
  .admin-tab:hover { background: #00000008; }
  .admin-tab.active { background: var(--a-ink); color: #fff; }
  .admin-actions { display: flex; gap: 8px; align-items: center; }
  .btn {
    border: 1px solid var(--a-line);
    background: #fff;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  .btn:hover { border-color: #bbb; }
  .btn.primary { background: var(--a-ink); border-color: var(--a-ink); color: #fff; }
  .btn.primary:hover { background: #000; }
  .btn.danger { color: var(--a-accent); }
  .btn.small { padding: 5px 10px; font-size: 12px; }
  .btn.active { background: #1C2440; border-color: #1C2440; color: #fff; }
  /* Maintenance switch: green = site live, red = maintenance. */
  .maint-switch {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px 6px 6px; border: 0; border-radius: 999px; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 600; color: #fff;
    background: #2e7d4f; transition: background .2s ease;
  }
  .maint-switch .maint-knob {
    position: relative; width: 34px; height: 20px; border-radius: 999px; background: rgba(255, 255, 255, .35);
  }
  .maint-switch .maint-knob::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; transition: transform .2s ease;
  }
  .maint-switch[aria-checked="true"] { background: #c8342c; }
  .maint-switch[aria-checked="true"] .maint-knob::after { transform: translateX(14px); }
  .maint-switch[disabled] { opacity: .6; cursor: default; }
  .maint-switch:focus-visible { outline: 2px solid #1C2440; outline-offset: 2px; }

  /* ---- English fields (disabled: the site is English-only) ---- */
  .en-field { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .en-field .en-input { flex: 1; min-width: 0; }
  .en-badge {
    flex: none;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.06em;
    padding: 2px 5px;
    border-radius: 4px;
    background: #1C2440;
    color: #fff;
  }
  .proj-en { padding-left: 27px; }   /* under the fields, after the ⠿ handle */
  .proj-en .en-field { margin-top: 0; }
  .proj-en .en-field.w-title { width: 170px; }
  .proj-en .en-field.w-role { width: 150px; }
  .about-tile-row .en-field { flex: 1; min-width: 140px; margin-top: 0; }
  .save-status { font-size: 12.5px; color: var(--a-muted); min-width: 110px; text-align: right; }
  .save-status.ok { color: #2e7d4f; }
  .save-status.err { color: var(--a-accent); }

  .storage-warning {
    background: #fdecec;
    border-bottom: 1px solid #f3c9c9;
    color: #8c1c24;
    padding: 12px 22px;
    font-size: 13px;
    line-height: 1.5;
  }
  .storage-warning a { color: #8c1c24; }

  main { max-width: 980px; margin: 0 auto; padding: 26px 22px 120px; }
  .panel-note { color: var(--a-muted); font-size: 12.5px; margin: 0 0 18px; line-height: 1.5; }

  /* ---- Cards ---- */
  .card {
    background: var(--a-card);
    border: 1px solid var(--a-line);
    border-radius: 12px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .card.dragging { opacity: 0.45; }
  .card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
  }
  .drag-handle {
    cursor: grab;
    color: var(--a-muted);
    padding: 6px 4px;
    border-radius: 6px;
    flex-shrink: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  .drag-handle:hover { background: #00000008; color: var(--a-ink); }
  .drag-handle:active { cursor: grabbing; }
  .color-dot {
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid #00000022;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 13px;
  }
  .head-name { flex: 1; font-weight: 700; font-size: 14px; }
  .card-body { border-top: 1px solid var(--a-line); padding: 14px; display: none; }
  .card.openned .card-body { display: block; }
  .fields { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 4px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > label { font-size: 11.5px; font-weight: 700; color: var(--a-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .field.grow { flex: 1; min-width: 200px; }

  /* ---- Colors ---- */
  .color-field { display: flex; align-items: center; gap: 6px; }
  .color-field input[type="color"] { padding: 0; width: 34px; height: 32px; border-radius: 7px; cursor: pointer; }
  .color-field input[type="text"] { width: 86px; }
  .swatches { display: flex; gap: 4px; flex-wrap: wrap; max-width: 240px; }
  .swatch {
    width: 17px; height: 17px;
    border-radius: 5px;
    border: 1px solid #00000026;
    cursor: pointer;
    padding: 0;
  }
  .swatch:hover { transform: scale(1.2); }

  /* ---- Nested projects ---- */
  .proj-zone { margin-top: 14px; border-top: 1px dashed var(--a-line); padding-top: 12px; }
  .proj-zone > h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--a-muted); }
  .proj-row {
    background: #fafaf6;
    border: 1px solid var(--a-line);
    border-radius: 9px;
    padding: 10px;
    margin-bottom: 8px;
  }
  .proj-row.dragging { opacity: 0.45; }
  .proj-main { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .proj-main input.p-title { width: 170px; }
  .proj-main input.p-role { width: 150px; }
  .proj-main input.p-url { flex: 1; min-width: 200px; }
  .proj-opts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .proj-opts .hint { font-size: 11px; color: var(--a-muted); }

  /* ---- Gallery (globe) ---- */
  .settings-card { padding: 14px; display: flex; gap: 26px; align-items: flex-end; flex-wrap: wrap; }
  .settings-count { font-size: 13px; padding: 7px 0; }
  .badge-out {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #8c1c24;
    background: #fdecec;
    border: 1px solid #f3c9c9;
    border-radius: 6px;
    padding: 3px 7px;
    white-space: nowrap;
  }
  .card.out-of-globe { opacity: 0.6; }
  .short-body { display: flex !important; gap: 16px; align-items: flex-start; }
  .short-body .fields { flex: 1; }
  .short-preview {
    flex-shrink: 0;
    width: 72px;
    aspect-ratio: 9 / 16;
    padding: 2px;
    border-radius: 4px;
    background: #fff;
    box-shadow: 0 6px 14px -8px rgba(20, 20, 25, 0.5), 0 1px 2px rgba(0, 0, 0, 0.12);
  }
  .short-preview.landscape { width: 128px; aspect-ratio: 16 / 9; }
  .thumb { position: relative; width: 100%; height: 100%; border-radius: 2px; overflow: hidden; container-type: inline-size; }
  .thumb-card {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 6%; text-align: center;
    font-weight: 800; text-transform: uppercase; line-height: 1.02; letter-spacing: 0.02em; text-wrap: balance;
    overflow: hidden;
  }
  .thumb img, .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.3s ease; }
  .thumb.has-media img, .thumb.has-media video { opacity: 1; }
  .field .hint { font-size: 11px; color: var(--a-muted); line-height: 1.4; }

  .add-row { margin: 10px 0 30px; }
  .list-note { font-size: 12px; color: var(--a-muted); margin: -6px 0 12px; }

  /* ---- Fonts ---- */
  .font-card { padding: 14px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .font-sample { font-size: 24px; flex: 1; min-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .font-kind { font-size: 11px; color: var(--a-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .fonts-add { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 26px; }
  .fonts-add .card { flex: 1; min-width: 300px; padding: 16px; margin: 0; }
  .fonts-add h3 { margin: 0 0 10px; font-size: 13.5px; }
  .fonts-add p { font-size: 12px; color: var(--a-muted); margin: 0 0 12px; line-height: 1.5; }
  .inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* ---- About (folder) ---- */
  .about-card .card-head h3 { margin: 0; font-size: 13.5px; }
  .about-card .card-body { display: block; }
  .about-card textarea {
    width: 100%;
    resize: vertical;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 12.5px;
    line-height: 1.5;
  }
  .about-card code { background: #f1efe8; padding: 1px 4px; border-radius: 4px; font-size: 11.5px; }
  .panel-note code { background: #ebe9e2; padding: 1px 4px; border-radius: 4px; }
  .about-text { margin-top: 10px; }
  .about-count { text-align: right; }
  .about-photo-row { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
  .about-photo-row .fields { flex: 1; min-width: 260px; }
  .about-photo-preview {
    flex-shrink: 0;
    width: 120px;
    height: 130px;
    margin: 6px 10px 4px 6px;
    padding: 6px;
    background: #fff;
    box-shadow: 0 8px 18px -10px rgba(0, 0, 0, .55), 0 1px 2px rgba(0, 0, 0, .15);
    transform: rotate(-2deg);
  }
  .about-photo-preview img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  .about-photo-none {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    height: 100%;
    background: #e6e3da;
    color: var(--a-muted);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-align: center;
  }
  .about-photo-none svg { width: 44px; height: 44px; fill: #c4c0b4; }

  /* ---- Data (stats) ---- */
  .data-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  .data-head .panel-note { flex: 1; min-width: 260px; margin: 6px 0 14px; }
  .data-range { display: inline-flex; gap: 2px; background: #fff; border: 1px solid var(--a-line); border-radius: 9px; padding: 3px; }
  .data-range button {
    border: none; background: none; padding: 6px 12px; border-radius: 6px;
    font-size: 12.5px; font-weight: 600; color: var(--a-muted); cursor: pointer; white-space: nowrap;
  }
  .data-range button:hover { background: #00000008; }
  .data-range button[aria-pressed="true"] { background: var(--a-ink); color: #fff; }
  .data-body { transition: opacity .2s; }
  .data-body.loading { opacity: 0.5; }
  .data-loading, .data-none { color: var(--a-muted); font-size: 12.5px; margin: 0; }
  .data-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .stat-tile { background: var(--a-card); border: 1px solid var(--a-line); border-radius: 12px; padding: 14px 16px; }
  .stat-tile .label { font-size: 11.5px; font-weight: 700; color: var(--a-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-tile .value { font-size: 30px; font-weight: 600; line-height: 1.1; margin-top: 6px; }
  .stat-tile .sub { font-size: 11.5px; color: var(--a-muted); margin-top: 4px; }
  .data-card { padding: 16px; }
  .data-card h3 { margin: 0 0 12px; font-size: 13.5px; }
  .data-empty { text-align: center; color: var(--a-muted); padding: 44px 16px; font-size: 14px; }
  .data-hint { background: #fdecec; border: 1px solid #f3c9c9; color: #8c1c24; padding: 14px 16px; border-radius: 10px; line-height: 1.55; font-size: 13px; }
  .data-hint a { color: #8c1c24; }
  .data-legend { display: flex; gap: 18px; font-size: 12px; color: var(--a-muted); margin-bottom: 8px; }
  .data-legend span::before {
    content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px;
    margin-right: 6px; vertical-align: -1px; background: var(--k);
  }
  .data-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .data-chart .grid { stroke: var(--a-line); stroke-width: 1; }
  .data-chart .tick { font-size: 11px; fill: var(--a-muted); }
  .data-chart .hit { fill: transparent; }
  .data-chart .col:hover .hit { fill: #0000000a; }
  .data-chart .bar { fill: #7C8CD9; }
  .data-chart .line { fill: none; stroke: #D63F64; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .data-chart .dot { fill: #D63F64; stroke: #fff; stroke-width: 2; }
  .data-table { margin-top: 10px; font-size: 12px; }
  .data-table summary { cursor: pointer; color: var(--a-muted); font-weight: 600; }
  .data-table table { border-collapse: collapse; margin-top: 8px; min-width: 280px; }
  .data-table th, .data-table td { text-align: right; padding: 3px 12px 3px 0; border-bottom: 1px solid var(--a-line); font-variant-numeric: tabular-nums; }
  .data-table th:first-child, .data-table td:first-child { text-align: left; }
  .data-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
  .data-grid .card { margin: 0; }
  .data-list { list-style: none; margin: 0; padding: 0; }
  .data-list li {
    display: grid; grid-template-columns: minmax(0, 1fr) 48px 40px;
    align-items: center; gap: 10px; padding: 2px 0; font-size: 12.5px;
  }
  .data-list .lbl { position: relative; padding: 4px 8px; overflow: hidden; border-radius: 4px; }
  .data-list .lbl i { position: absolute; top: 0; bottom: 0; left: 0; background: #7C8CD9; opacity: 0.22; border-radius: 4px; }
  .data-list .t { position: relative; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .data-list .n, .data-list .pct { text-align: right; font-variant-numeric: tabular-nums; }
  .data-list .pct { color: var(--a-muted); }

  .savebar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: color-mix(in srgb, var(--a-bg) 90%, transparent);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--a-line);
    padding: 12px 22px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
    z-index: 60;
  }
</style>
</head>
<body>
<datalist id="role-suggestions">
  <option value="AD"></option>
  <option value="Art direction"></option>
  <option value="Writing"></option>
  <option value="Production manager"></option>
  <option value="Directing"></option>
  <option value="Editing"></option>
  <option value="Production"></option>
</datalist>

<div class="login-wrap" id="login">
  <form class="login-card" id="login-form">
    <img src="assets/img/logo-black.png" alt="audrey-lillie">
    <h1>Admin panel</h1>
    <input type="password" id="login-pw" placeholder="Password" autocomplete="current-password" autofocus>
    <p class="login-error" id="login-error"></p>
    <button class="btn primary" type="submit" style="width:100%">Log in</button>
  </form>
</div>

<div id="app" hidden>
  <header class="admin-top">
    <img src="assets/img/logo-black.png" alt="audrey-lillie">
    <nav class="admin-tabs" id="tabs">
      <button class="admin-tab active" data-tab="youtube" type="button">Design</button>
      <button class="admin-tab" data-tab="shorts" type="button">Gallery</button>
      <button class="admin-tab" data-tab="brand" type="button">Collabs</button>
      <button class="admin-tab" data-tab="about" type="button">About</button>
      <button class="admin-tab" data-tab="contact" type="button">Contact</button>
      <button class="admin-tab" data-tab="fonts" type="button">Fonts</button>
      <button class="admin-tab" data-tab="data" type="button">Data</button>
    </nav>
    <div class="admin-actions">
      <a class="btn" href="./" target="_blank" rel="opener">View site ↗</a>
      <button class="maint-switch" id="btn-maint" type="button" role="switch" aria-checked="false" title="Put the site in maintenance mode: visitors only see a &quot;site under maintenance&quot; screen (the admin stays available)"><span class="maint-knob" aria-hidden="true"></span><span class="maint-label">Site live</span></button>
    </div>
  </header>
  <main id="panel"></main>
  <div class="savebar">
    <span class="save-status" id="save-status"></span>
    <button class="btn" id="btn-import" type="button" title="Load a file saved with &quot;Export JSON&quot; (nothing goes live until you click Save)">Import JSON</button>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
    <button class="btn" id="btn-export" type="button">Export JSON</button>
    <button class="btn primary" id="btn-save" type="button">Save</button>
  </div>
</div>

<script src="assets/js/common.js?v=2"></script>
<script src="assets/js/admin.js?v=2"></script>
</body>
</html>
